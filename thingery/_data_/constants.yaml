# Thingery Constants Dataset
# Physical constants, mathematical constants, and universal values
---
constants:
  # Fundamental Physical Constants
  avogadro:
    name: "Avogadro's Number"
    symbol: "NA"
    value: 6.02214076e23
    unit: "mol^-1"
    description: "Number of particles in one mole of substance"

  boltzmann:
    name: "Boltzmann Constant"
    symbol: "k"
    value: 1.380649e-23
    unit: "J/K"
    description: "Relates average kinetic energy to temperature"

  charge:
    name: "Elementary Charge"
    symbol: "e"
    value: 1.602176634e-19
    unit: "C"
    description: "Charge of a single electron or proton"

  speed_of_light:
    name: "Speed of Light"
    symbol: "c"
    value: 299792458
    unit: "m/s"
    description: "Light speed in vacuum (2024 measurement)"

  planks:
    name: "Planck's Constant"
    symbol: "h"
    value: 6.62607015e-34
    unit: "m^2 kg / s"
    description: "Fundamental constant of quantum mechanics"

  reduced_planks:
    name: "Reduced Planck Constant"
    symbol: "ħ"
    value: 1.054571817e-34
    unit: "J s"
    description: "Planck constant divided by 2π"

  gravitational_constant:
    name: "Gravitational Constant"
    symbol: "G"
    value: 6.67430e-11
    unit: "m^3 kg^-1 s^-2"
    description: "Newton's gravitational constant"

  permittivity:
    name: "Vacuum Permittivity"
    symbol: "ε0"
    value: 8.8541878128e-12
    unit: "F/m"
    description: "Permittivity of free space"

  permeability:
    name: "Vacuum Permeability"
    symbol: "μ0"
    value: 1.25663706212e-6
    unit: "N/A^2"
    description: "Permeability of free space"

  stefan_boltzmann:
    name: "Stefan-Boltzmann Constant"
    symbol: "σ"
    value: 5.670374419e-8
    unit: "W m^-2 K^-4"
    description: "Radiated power per area per temperature^4"

  rydberg:
    name: "Rydberg Constant"
    symbol: "R∞"
    value: 10973731.568160
    unit: "m^-1"
    description: "Wavenumber of hydrogen spectral lines"

  faraday:
    name: "Faraday Constant"
    symbol: "F"
    value: 96485.33212
    unit: "C/mol"
    description: "Charge per mole of electrons"

  gas_constant:
    name: "Ideal Gas Constant"
    symbol: "R"
    value: 8.314462618
    unit: "J/(mol·K)"
    description: "Universal gas constant"

  electron_mass:
    name: "Electron Mass"
    symbol: "me"
    value: 9.1093837015e-31
    unit: "kg"
    description: "Rest mass of electron"

  proton_mass:
    name: "Proton Mass"
    symbol: "mp"
    value: 1.67262192369e-27
    unit: "kg"
    description: "Rest mass of proton"

  neutron_mass:
    name: "Neutron Mass"
    symbol: "mn"
    value: 1.67492749804e-27
    unit: "kg"
    description: "Rest mass of neutron"

  atomic_mass_unit:
    name: "Atomic Mass Unit"
    symbol: "u"
    value: 1.66053906660e-27
    unit: "kg"
    description: "1/12 mass of carbon-12 atom"

  # Mathematical Constants
  pi:
    name: "Pi"
    symbol: "π"
    value: 3.141592653589793
    unit: ""
    description: "Ratio of circle circumference to diameter"

  e:
    name: "Euler's Number"
    symbol: "e"
    value: 2.718281828459045
    unit: ""
    description: "Base of natural logarithm"

  phi:
    name: "Golden Ratio"
    symbol: "φ"
    value: 1.618033988749895
    unit: ""
    description: "Divine proportion (1+√5)/2"

  sqrt2:
    name: "Square Root of 2"
    symbol: "√2"
    value: 1.414213562373095
    unit: ""
    description: "Diagonal of unit square"

  sqrt3:
    name: "Square Root of 3"
    symbol: "√3"
    value: 1.732050807568877
    unit: ""
    description: "Diagonal of unit cube face"

  euler_gamma:
    name: "Euler-Mascheroni Constant"
    symbol: "γ"
    value: 0.5772156649015329
    unit: ""
    description: "Limit of harmonic series minus log n"

  # Earth & Planetary Constants
  earth_mass:
    name: "Earth Mass"
    symbol: "M⊕"
    value: 5.972e24
    unit: "kg"
    description: "Mass of Earth"

  earth_radius:
    name: "Earth Radius"
    symbol: "R⊕"
    value: 6371000
    unit: "m"
    description: "Mean radius of Earth"

  earth_surface_gravity:
    name: "Earth Surface Gravity"
    symbol: "g"
    value: 9.80665
    unit: "m/s^2"
    description: "Standard gravity at Earth's surface"

  earth_atmosphere:
    name: "Standard Atmosphere"
    symbol: "atm"
    value: 101325
    unit: "Pa"
    description: "Standard atmospheric pressure"

  moon_mass:
    name: "Moon Mass"
    symbol: "M☾"
    value: 7.342e22
    unit: "kg"
    description: "Mass of Earth's moon"

  solar_mass:
    name: "Solar Mass"
    symbol: "M☉"
    value: 1.989e30
    unit: "kg"
    description: "Mass of Sun"

  solar_luminosity:
    name: "Solar Luminosity"
    symbol: "L☉"
    value: 3.828e26
    unit: "W"
    description: "Power output of Sun"

  astronomical_unit:
    name: "Astronomical Unit"
    symbol: "AU"
    value: 149597870700
    unit: "m"
    description: "Mean Earth-Sun distance"

  # Particle Physics
  weak_mixing_angle:
    name: "Weinberg Angle"
    symbol: "θW"
    value: 0.2229
    unit: "rad"
    description: "Electroweak mixing angle"

  fine_structure:
    name: "Fine-Structure Constant"
    symbol: "α"
    value: 7.2973525693e-3
    unit: ""
    description: "Electromagnetic coupling constant"

  # Time Constants
  planck_time:
    name: "Planck Time"
    symbol: "tP"
    value: 5.391247e-44
    unit: "s"
    description: "Natural unit of time"

  planck_length:
    name: "Planck Length"
    symbol: "ℓP"
    value: 1.616255e-35
    unit: "m"
    description: "Natural unit of length"

  planck_temperature:
    name: "Planck Temperature"
    symbol: "TP"
    value: 1.416784e32
    unit: "K"
    description: "Natural unit of temperature"

  # Other Useful Constants
  standard_temperature:
    name: "Standard Temperature"
    symbol: "STP"
    value: 273.15
    unit: "K"
    description: "0°C in Kelvin"

  standard_pressure:
    name: "Standard Pressure"
    symbol: "STP"
    value: 101325
    unit: "Pa"
    description: "1 atm in Pascals"

  absolute_zero:
    name: "Absolute Zero"
    symbol: "0 K"
    value: -273.15
    unit: "°C"
