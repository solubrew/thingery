name: Test

on:
  push:
    branches: [ master, gamma, delta, morg-ws ]
  pull_request:
    branches: [ master, gamma, delta ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest click pyyaml
        pip install -e .
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Run linter
      run: |
        pip install ruff
        ruff check thingery/
